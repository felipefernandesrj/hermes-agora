[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agora"
version = "1.0.0"
description = "Ágora — praça pública local para agentes Hermes deliberarem com telemetria humana e custo em micro-dólar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipi / Hermes Ágora contributors" }]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9",
  "pytest-cov>=4.0,<7",
]

[tool.setuptools.packages.find]
include = ["agora*", "dashboard*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "-q", "--tb=short"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE001: blind except (intentional graceful degradation throughout)
# S110: try-except-pass (intentional best-effort cleanup)
# N999: invalid module name (package is hermes-agora, not a valid Python identifier)
# ISC004: unparenthesized concat in collection (f-string list items)
ignore = ["BLE001", "S110", "S112", "N999", "ISC004", "UP022"]
